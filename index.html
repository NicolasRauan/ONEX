const BLOCKS=/^(P|H1|H2|H3|H4|DIV|UL|OL|BLOCKQUOTE|TABLE|HR|IMG|PRE|FIGURE)$/;
function curBlock(ed){const s=getSelection();if(!s.rangeCount)return null;let n=s.getRangeAt(0).startContainer;if(!ed.contains(n))return null;let li=null;if(n===ed){const c=ed.childNodes[s.getRangeAt(0).startOffset]||ed.lastChild;return{top:c||null,li:null}}while(n&&n!==ed){if(n.nodeName==='LI'&&!li)li=n;if(n.parentNode===ed)return{top:n,li};n=n.parentNode}return{top:null,li}}
function fillEmpty(el){if(!el.textContent&&!el.querySelector('br,img,table,hr')){el.innerHTML='';el.appendChild(document.createElement('br'))}}
function caretIn(el,end){const r=document.createRange();if(end&&!(el.childNodes.length===1&&el.firstChild.nodeName==='BR')){r.selectNodeContents(el);r.collapse(false)}else{r.setStart(el,0);r.collapse(true)}const s=getSelection();s.removeAllRanges();s.addRange(r)}
function topBlock(ed){
 let b=curBlock(ed);
 if(!b||!b.top){const p=document.createElement('p');p.appendChild(document.createElement('br'));ed.appendChild(p);return{top:p,li:null}}
 let top=b.top;
 if(!BLOCKS.test(top.nodeName)){const p=document.createElement('p');let st=top;while(st.previousSibling&&!BLOCKS.test(st.previousSibling.nodeName))st=st.previousSibling;ed.insertBefore(p,st);let n=st;while(n&&!BLOCKS.test(n.nodeName)){const nx=n.nextSibling;p.appendChild(n);n=nx}fillEmpty(p);top=p}
 return{top,li:b.li};
}
function liftLi(li){const list=li.parentNode;const rest=document.createElement(list.nodeName);if(list.className)rest.className=list.className;while(li.nextSibling)rest.appendChild(li.nextSibling);const p=document.createElement('p');while(li.firstChild)p.appendChild(li.firstChild);li.remove();list.after(p);if(rest.children.length)p.after(rest);if(!list.children.length)list.remove();fillEmpty(p);return p}
function setBlock(ed,tag,cls){let{top,li}=topBlock(ed);if(li)top=liftLi(li);if(/^(TABLE|HR|IMG|UL|OL)$/.test(top.nodeName))return;const el=document.createElement(tag);if(cls)el.className=cls;while(top.firstChild)el.appendChild(top.firstChild);fillEmpty(el);top.replaceWith(el);caretIn(el,true)}
function setList(ed,kind){
 const tag=kind==='ol'?'OL':'UL',cls=kind==='check'?'check':'';let{top,li}=topBlock(ed);
 if(li){const list=li.parentNode;if(list.nodeName===tag&&(list.className||'')===cls){caretIn(liftLi(li),true);return}const nl=document.createElement(tag);if(cls)nl.className=cls;while(list.firstChild)nl.appendChild(list.firstChild);list.replaceWith(nl);caretIn(li,true);return}
 if(/^(TABLE|HR|IMG)$/.test(top.nodeName))return;
 const l=document.createElement(tag);if(cls)l.className=cls;const it=document.createElement('li');while(top.firstChild)it.appendChild(top.firstChild);fillEmpty(it);l.appendChild(it);
 const prev=top.previousElementSibling;top.replaceWith(l);if(prev&&prev.nodeName===tag&&(prev.className||'')===cls){prev.appendChild(it);l.remove()}caretIn(it,true);
}
function insertBlock(ed,el){
 const{top,li}=topBlock(ed);let anchor=li||top;while(anchor.parentNode&&anchor.parentNode!==ed)anchor=anchor.parentNode;
 const empty=!li&&top.nodeName==='P'&&!top.textContent.trim()&&!top.querySelector('img');
 if(empty)top.replaceWith(el);else anchor.after(el);
 const p=document.createElement('p');p.appendChild(document.createElement('br'));el.after(p);caretIn(p);return el;
}
const CMDS={
 p:ed=>setBlock(ed,'P'),h2:ed=>setBlock(ed,'H2'),h3:ed=>setBlock(ed,'H3'),quote:ed=>setBlock(ed,'BLOCKQUOTE'),callout:ed=>setBlock(ed,'DIV','callout'),
 ul:ed=>setList(ed,'ul'),ol:ed=>setList(ed,'ol'),check:ed=>setList(ed,'check'),
 hr:ed=>insertBlock(ed,document.createElement('hr')),
 table:ed=>{const t=document.createElement('table');t.innerHTML='<tbody>'+('<tr>'+'<td><br></td>'.repeat(3)+'</tr>').repeat(3)+'</tbody>';insertBlock(ed,t);caretIn(t.querySelector('td'))},
 time:()=>document.execCommand('insertHTML',false,`<b>${hhmm()}</b>&nbsp;– `),
 date:()=>document.execCommand('insertText',false,brDate(today())),
 image:async ed=>{const s=getSelection();const range=s.rangeCount?s.getRangeAt(0).cloneRange():null;const f=await pickFile();if(f)insertImageFile(ed,f,range)},
 task:(ed,origin)=>{const s=getSelection().toString().trim();editTask(null,{title:s.slice(0,200),noteId:ed._noteId||null,desc:!ed._noteId&&origin?'Origem: '+origin():''})},

};

const MD={'#':'h2','##':'h3','-':'ul','*':'ul','1.':'ol','[]':'check','>':'quote'};
let SL=null,BUB=null;
function closeSlash(){if(SL){SL.pop.remove();SL=null}}
function slashCheck(ed,origin){
 const sel=getSelection();if(!sel.rangeCount||!sel.isCollapsed){closeSlash();return}
 const r=sel.getRangeAt(0),n=r.startContainer;if(n.nodeType!==3){closeSlash();return}
 const before=n.textContent.slice(0,r.startOffset);const m=before.match(/(?:^|\s)\/([^\s\/]{0,20})$/);if(!m){closeSlash();return}
 const q=norm(m[1]);const items=SLASH.filter(it=>!q||norm(it.l+' '+it.kw).includes(q));if(!items.length){closeSlash();return}
 const rr=r.cloneRange();rr.setStart(n,Math.max(0,r.startOffset-1));const rect=rr.getBoundingClientRect();
 if(!SL){const p=document.createElement('div');p.className='pop slash';document.body.appendChild(p);SL={pop:p,i:0};
  p.addEventListener('mousedown',e=>{e.preventDefault();const it=e.target.closest('[data-i]');if(it){SL.i=+it.dataset.i;applySlash()}});}
 Object.assign(SL,{ed,origin,node:n,start:r.startOffset-m[1].length-1,end:r.startOffset,items});SL.i=Math.min(SL.i,items.length-1);
 SL.pop.innerHTML='<div class="hd">Blocos</div>'+items.map((it,i)=>`<div class="it${i===SL.i?' on':''}" data-i="${i}"><span class="ic">${it.ic}</span><div><b>${it.l}</b><small>${it.d}</small></div></div>`).join('');
 positionPop(SL.pop,{left:rect.left,right:rect.right,top:rect.top,bottom:rect.bottom+2});
}
function slashMove(d){if(!SL)return;SL.i=(SL.i+d+SL.items.length)%SL.items.length;$$('.it',SL.pop).forEach((el,i)=>el.classList.toggle('on',i===SL.i));$('.it.on',SL.pop)?.scrollIntoView({block:'nearest'})}
function applySlash(){
 if(!SL)return;const{node,start,end,ed,items,i,origin}=SL;const it=items[i];closeSlash();
 try{const rr=document.createRange();rr.setStart(node,Math.max(0,start));rr.setEnd(node,Math.min(end,node.length));const s=getSelection();s.removeAllRanges();s.addRange(rr);rr.deleteContents()}catch(e){}
 ed.focus();CMDS[it.k](ed,origin);ed.dispatchEvent(new Event('input'));
}
function hideBubble(){if(BUB){BUB.remove();BUB=null}}
function bubbleCheck(){
 const s=getSelection();if(!s.rangeCount||s.isCollapsed){hideBubble();return}
 const r=s.getRangeAt(0);const c=r.commonAncestorContainer;const el=(c.nodeType===1?c:c.parentElement);const ed=el&&el.closest('.editor');
 if(!ed){hideBubble();return}const rect=r.getBoundingClientRect();if(!rect.width){hideBubble();return}
 if(!BUB){BUB=document.createElement('div');BUB.className='pop bubble';BUB.innerHTML=`<button data-c="bold" title="Negrito"><b>B</b></button><button data-c="italic" title="Itálico"><i>I</i></button><button data-c="underline" title="Sublinhado"><u>S</u></button><button data-c="strikeThrough" title="Riscado"><s>R</s></button><button data-c="hilite" title="Marca-texto">🖍</button><span class="sep"></span><button data-c="h2" title="Título">T1</button><button data-c="h3" title="Subtítulo">T2</button><button data-c="removeFormat" title="Limpar formatação">⌫</button><span class="sep"></span><button data-c="task" class="acc" title="Transformar em pendência">+ Pendência</button>`;
  document.body.appendChild(BUB);
  BUB.addEventListener('mousedown',e=>{e.preventDefault();const b=e.target.closest('[data-c]');if(!b)return;const edd=BUB._ed;const c=b.dataset.c;
   if(c==='hilite'){document.execCommand('styleWithCSS',false,true);document.execCommand('hiliteColor',false,'rgba(250,204,21,.42)');document.execCommand('styleWithCSS',false,false)}
   else if(c==='task'){CMDS.task(edd,edd._origin);hideBubble();return}
   else if(CMDS[c])CMDS[c](edd);else document.execCommand(c);
   edd.dispatchEvent(new Event('input'))});}
 BUB._ed=ed;const bw=BUB.offsetWidth;let left=rect.left+rect.width/2-bw/2;left=Math.max(10,Math.min(innerWidth-bw-10,left));let top=rect.top-46;if(top<10)top=rect.bottom+8;
 BUB.style.left=left+'px';BUB.style.top=top+'px';
}
function serialize(ed){const c=ed.cloneNode(true);c.querySelectorAll('img[data-f]').forEach(i=>i.removeAttribute('src'));c.querySelectorAll('img.missing').forEach(i=>{i.classList.remove('missing');i.removeAttribute('alt');if(!i.className)i.removeAttribute('class')});return c.innerHTML}
function hydrateLinks(root){root.querySelectorAll('a.plink[data-note]').forEach(a=>{const n=noteById(a.dataset.note);a.contentEditable='false';if(n){a.textContent=noteEmoji(n)+' '+(n.title||'Sem título');a.classList.remove('broken')}else{a.textContent='📄 página excluída';a.classList.add('broken')}})}
function pagePicker(ed){
 const s=getSelection();const range=s.rangeCount?s.getRangeAt(0).cloneRange():null;const rect=range?range.getBoundingClientRect():ed.getBoundingClientRect();
 const p=openPop({left:rect.left,right:rect.right,top:rect.top,bottom:rect.bottom},`<input placeholder="Buscar página…"><div class="l menu"></div>`,'pgpick');
 const inp=$('input',p),l=$('.l',p);let items=[];
 const draw=()=>{const q=norm(inp.value);items=DB.notes.filter(n=>n.id!==ed._noteId&&(!q||norm(n.title).includes(q))).sort((a,b)=>b.updated-a.updated).slice(0,30);l.innerHTML=items.map((n,i)=>`<button data-i="${i}"><span class="mi">${noteEmoji(n)}</span><span>${esc(n.title||'Sem título')}<small>${esc(folderName(n.fid))}</small></span></button>`).join('')||'<div class="empty">Nenhuma página.</div>'};
 const pick=n=>{closePop();ed.focus();if(range){s.removeAllRanges();s.addRange(range)}document.execCommand('insertHTML',false,`<a class="plink" data-note="${n.id}" contenteditable="false">${noteEmoji(n)} ${esc(n.title||'Sem título')}</a>&nbsp;`);ed.dispatchEvent(new Event('input'))};
 inp.oninput=draw;inp.onkeydown=e=>{if(e.key==='Enter'&&items[0]){e.preventDefault();pick(items[0])}if(e.key==='Escape')closePop()};
 l.onclick=e=>{const b=e.target.closest('[data-i]');if(b)pick(items[b.dataset.i])};draw();setTimeout(()=>inp.focus(),20);
}
async function insertImageFile(ed,file,range){
 const ref=await saveImage(file,'inline');ed.focus();
 if(range&&ed.contains(range.startContainer)){const s=getSelection();s.removeAllRanges();s.addRange(range)}
 const img=document.createElement('img');img.alt='';if(ref.f)img.dataset.f=ref.f;else img.src=ref.d;
 insertBlock(ed,img);hydrate(ed);ed.dispatchEvent(new Event('input'));
}
function attachEditor(ed,onChange,origin){
 ed._origin=origin;hydrate(ed);hydrateLinks(ed);try{document.execCommand('defaultParagraphSeparator',false,'p')}catch(e){}
 let last=serialize(ed);const commit=()=>{const h=serialize(ed);if(h!==last){last=h;onChange(h)}};const fire=debounce(commit,450);
 ed.addEventListener('input',()=>{fire();slashCheck(ed,origin)});
 ed.addEventListener('blur',()=>{commit();setTimeout(()=>{if(SL&&SL.ed===ed&&document.activeElement!==ed)closeSlash()},150)});
 ed.addEventListener('keydown',e=>{
  if(SL&&SL.ed===ed){if(e.key==='ArrowDown'){e.preventDefault();slashMove(1);return}if(e.key==='ArrowUp'){e.preventDefault();slashMove(-1);return}if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();applySlash();return}if(e.key==='Escape'){e.preventDefault();closeSlash();return}}
  if(e.key===' '){const s=getSelection();if(s.rangeCount&&s.isCollapsed){const r=s.getRangeAt(0),n=r.startContainer;if(n.nodeType===3&&!n.previousSibling){const before=n.textContent.slice(0,r.startOffset);const cmd=MD[before];if(cmd){e.preventDefault();const rr=document.createRange();rr.setStart(n,0);rr.setEnd(n,r.startOffset);rr.deleteContents();CMDS[cmd](ed);fire();return}}}}
  if(e.key==='Tab'){e.preventDefault();const td=(getSelection().anchorNode?.nodeType===1?getSelection().anchorNode:getSelection().anchorNode?.parentElement)?.closest('td,th');
   if(td&&ed.contains(td)){const cells=[...td.closest('table').querySelectorAll('td,th')];let i=cells.indexOf(td)+(e.shiftKey?-1:1);
    if(i>=cells.length){const tr=td.closest('tr').cloneNode(true);tr.querySelectorAll('td,th').forEach(c=>c.innerHTML='<br>');td.closest('tbody').appendChild(tr);caretIn(tr.firstElementChild);fire();return}
    if(i>=0)caretIn(cells[i],true);return}
   document.execCommand(e.shiftKey?'outdent':'indent')}
 });
 ed.addEventListener('focus',()=>{if(!ed.textContent.trim()&&!ed.querySelector('img,hr,table,li')){ed.innerHTML='<p><br></p>';caretIn(ed.firstChild)}});
 ed.addEventListener('click',e=>{const pl=e.target.closest('a.plink');if(pl){e.preventDefault();if(noteById(pl.dataset.note))go('notas',pl.dataset.note);return}
  const li=e.target.closest('ul.check>li');if(li&&e.target===li&&e.offsetX<28){if(li.classList.toggle('done'))Sound.play('tick');fire()}});
 ed.addEventListener('paste',e=>{const items=[...(e.clipboardData?.items||[])];const img=items.find(i=>i.type.startsWith('image/'));const s=getSelection();const range=s.rangeCount?s.getRangeAt(0).cloneRange():null;
  if(img){e.preventDefault();insertImageFile(ed,img.getAsFile(),range);return}
  e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
 ed.addEventListener('dragover',e=>{if([...e.dataTransfer.items].some(i=>i.kind==='file'))e.preventDefault()});
 ed.addEventListener('drop',e=>{const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/'));if(!f)return;e.preventDefault();const range=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null;insertImageFile(ed,f,range)});
}

async function installUpdate(){
 const f=await pickFile('.html,text/html');if(!f)return;
 const txt=await f.text();const m=txt.match(/<meta name="(?:onex|egide)-version" content="([^"]+)"/);
 if(!m){await askDialog({title:'Arquivo não reconhecido',msg:'Esse arquivo não é uma versão do ONEX com instalador automático. Escolha o novo arquivo <b>ONEX.html</b> que você recebeu.',ok:'Ok',cancel:null,icon:'⚠️'});return}
 const nv=m[1];
 if(!await askDialog({title:`Instalar a versão ${nv}?`,icon:'⬆',ok:'Instalar agora',msg:`Versão atual: <b>${APP_VERSION}</b> → nova: <b>${esc(nv)}</b>.<br><br>Só o sistema é atualizado. Suas páginas, agenda, pendências e fluxogramas continuam intactos.`}))return;
 if(Store.dirty||Store.writing)await Store.writeNow();
 const name=curFileName();
 const done=()=>{toast('Atualização instalada! Reiniciando o ONEX…','ok');setTimeout(()=>location.reload(),1000)};
 if(Store.live){let h=null;try{h=await Store.dir.getFileHandle(name)}catch(e){}
  if(h){try{const old=await(await h.getFile()).text();await Store.writeText(`onex-sistema-v${APP_VERSION}.html`,old,'backups')}catch(e){}
   try{await Store.writeText(name,txt);done();return}catch(e){console.warn(e)}}}
 if(!('showSaveFilePicker' in window)){download(new Blob([txt],{type:'text/html'}),name);toast('Baixei a nova versão. Substitua o arquivo antigo por ela.');return}
 await askDialog({title:'Confirme o arquivo do ONEX',icon:'📄',ok:'Continuar',cancel:null,msg:`Na próxima janela, selecione o arquivo <b>${esc(name)}</b> que você usa hoje e confirme para substituí-lo pela nova versão.`});
 try{const h=await window.showSaveFilePicker({suggestedName:name,startIn:'downloads',types:[{description:'ONEX',accept:{'text/html':['.html']}}]});
  const w=await h.createWritable();await w.write(txt);await w.close();
  if(h.name!==name){await askDialog({title:'Nova versão salva',icon:'✓',ok:'Ok',cancel:null,msg:`A nova versão foi salva como <b>${esc(h.name)}</b>. Abra esse arquivo para usar a atualização.`});return}
  done();
 }catch(e){if(e.name!=='AbortError')toast('Não foi possível instalar: '+e.message,'err')}
}

async function resetAll(){
 if(!await askTyped({title:'Começar do zero?',word:'REINICIAR',ok:'Apagar e recomeçar',msg:'Todos os ambientes (páginas, agenda, pendências, fluxogramas e perfil) serão apagados deste computador'+(Store.live?' e da pasta conectada. Antes disso, uma <b>cópia de segurança</b> de cada ambiente vai para a subpasta <b>backups</b>.':'.')+'<br><br>O ONEX vai reiniciar com a apresentação inicial.'}))return;
 const st=stamp();
 if(Store.live){for(const E of Object.values(ENVS)){try{const fh=await Store.dir.getFileHandle(E.file);const t=await(await fh.getFile()).text();await Store.writeText(`antes-de-zerar-${st}-${E.file}`,t,'backups');await Store.dir.removeEntry(E.file)}catch(e){}}}
 Store.dirty=false;Store.writing=false;
 try{Object.values(ENVS).forEach(E=>localStorage.removeItem(E.ls));['onex-env','egide-open','onex-ai-key','egide-ai-key'].forEach(k=>localStorage.removeItem(k))}catch(e){}
 window.__resetting=true;location.reload();
}
/* ---------- Notificações (painel) ---------- */
function openBell(btn){
 const draw=()=>{const list=DB.notifs;return `<div class="np-h"><b>Notificações</b>${list.some(n=>!n.read)?'<button class="link" id="npRead">Marcar como lidas</button>':''}</div>
  ${Notif.perm()==='default'?`<div class="np-cta"><span>Receba alertas do Windows mesmo com o ONEX minimizado.</span><button class="btn sm primary" id="npEn">Ativar</button></div>`:''}
  <div class="np-list">${list.length?list.slice(0,40).map(n=>`<div class="np-it${n.read?'':' unread'}" data-n="${n.id}"><i></i><div><b>${esc(n.title)}</b><span>${esc(n.body)}</span><small>${relTime(n.ts)}</small></div></div>`).join(''):'<div class="empty">Nenhuma notificação por enquanto.<br><small>Lembretes de compromissos e o resumo do dia aparecem aqui.</small></div>'}</div>
  <div class="np-f"><button class="link" id="npCfg">Configurar</button>${list.length?'<button class="link" id="npClr">Limpar tudo</button>':''}</div>`};
 const p=openPop(btn,draw(),'np');
 p.onclick=e=>{const it=e.target.closest('[data-n]');
  if(it){const n=DB.notifs.find(x=>x.id===it.dataset.n);if(n){n.read=true;save();closePop();openRef(n.ref)}return}
  if(e.target.closest('#npRead')){DB.notifs.forEach(n=>n.read=true);save();p.innerHTML=draw()}
  if(e.target.closest('#npClr')){DB.notifs=[];save();p.innerHTML=draw()}
  if(e.target.closest('#npEn')){closePop();Notif.enable()}
  if(e.target.closest('#npCfg')){closePop();go('config')}};
}

/* ---------- Busca / comandos (Ctrl+K) ---------- */
function searchAll(q){
 const nq=norm(q),R=[];if(nq.length<2)return R;const has=s=>norm(s).includes(nq);
 DB.folders.forEach(f=>{if(has(f.name))R.push({g:'Pastas',ic:iconHTML(f.icon,'📁'),t:f.name,s:DB.notes.filter(n=>n.fid===f.id).length+' páginas',go:()=>go('pasta',f.id)})});
 DB.notes.forEach(n=>{if(has(n.title)||has(n.unit)||has(strip(n.content)))R.push({g:'Páginas',ic:iconHTML(n.icon),t:n.title||'Sem título',s:folderName(n.fid)+(n.unit?' · '+n.unit:''),go:()=>go('notas',n.id)})});
 DB.tasks.forEach(x=>{if(has(x.title)||has(x.desc)||has(x.unit))R.push({g:'Pendências',ic:x.status==='done'?'☑':'○',t:x.title,s:STATUS.find(s=>s.k===x.status)?.l+(x.unit?' · '+x.unit:'')+(x.due?' · '+brDate(x.due):''),go:()=>editTask(x.id)})});
 DB.events.forEach(e=>{if(has(e.title)||has(e.notes)||has(e.unit)||has(e.place))R.push({g:'Compromissos',ic:'📅',t:e.title,s:brDate(e.date)+' '+(e.time||''),go:()=>{setAg(e.date);go('agenda')}})});
 Object.entries(DB.daily).forEach(([d,h])=>{const tx=strip(h);const i=norm(tx).indexOf(nq);if(i>=0)R.push({g:'Diário',ic:'📓',t:'Diário de '+brDate(d),s:'…'+tx.slice(Math.max(0,i-24),i+48)+'…',go:()=>go('diario',d)})});
 DB.flows.forEach(f=>{if(has(f.title)||f.nodes.some(n=>has(n.text)))R.push({g:'Fluxogramas',ic:'🔀',t:f.title,s:f.nodes.length+' blocos',go:()=>{FS.id=f.id;FS.fit=true;FS.hist=[];go('fluxos')}})});
 return R.slice(0,30);
}
function quickCmds(q){
 const all=[{ic:'✓',t:'Nova pendência',fn:()=>editTask(null)},{ic:'📅',t:'Novo compromisso',fn:()=>editEvent(null)},{ic:'📄',t:'Nova página',fn:()=>newNote('blank')},...Object.entries(NOTE_TPL).filter(([k])=>k!=='blank').map(([k,v])=>({ic:v.icon||'📄',t:'Novo: '+v.l,fn:()=>newNote(k)})),{ic:'🔁',t:'Trocar de ambiente',fn:()=>envMenu($('#envBtn'))},...(ENV.fin?[{ic:'💸',t:'Nova despesa',fn:()=>editTx(null,{type:'out'})},{ic:'💰',t:'Abrir Financeiro',fn:()=>go('fin')}]:[]),{ic:'✦',t:'Abrir IA (ChatGPT / Claude)',fn:()=>go('ia')},{ic:'🔀',t:'Novo fluxograma',fn:newFlow},{ic:'📁',t:'Nova pasta',fn:newFolder},{ic:'👤',t:'Meu perfil',fn:()=>go('perfil')},{ic:'📓',t:'Diário de hoje',fn:()=>go('diario',today())},{ic:'⚙',t:'Configurações',fn:()=>go('config')},{ic:'🌓',t:'Alternar tema claro/escuro',fn:()=>{DB.settings.theme=DB.settings.theme==='dark'?'light':'dark';applyTheme();save();renderCurrent()}}];
 const nq=norm(q);return all.filter(c=>!nq||norm(c.t).includes(nq)).map(c=>({g:'Ações',ic:c.ic,t:c.t,go:c.fn}));
}
function openCmd(){
 closePop();if($('.cmd-ov'))return;const ov=document.createElement('div');ov.className='ov cmd-ov';
 ov.innerHTML=`<div class="cmd"><div class="cmd-in"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="cmdQ" placeholder="Buscar páginas, pendências, compromissos… ou uma ação" autocomplete="off"></div><div class="cmd-list" id="cmdL"></div><div class="cmd-f"><span><kbd>↑</kbd> <kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> fechar</span></div></div>`;
 document.body.appendChild(ov);let R=[],i=0;const close=()=>ov.remove();
 const draw=()=>{const q=$('#cmdQ',ov).value.trim();R=q?[...quickCmds(q),...searchAll(q)]:[...quickCmds(''),...DB.notes.slice().sort((a,b)=>b.updated-a.updated).slice(0,5).map(n=>({g:'Recentes',ic:iconHTML(n.icon),t:n.title||'Sem título',s:folderName(n.fid),go:()=>go('notas',n.id)}))];
  i=Math.max(0,Math.min(i,R.length-1));let g='';
  $('#cmdL',ov).innerHTML=R.map((r,j)=>{const h=r.g!==g?`<div class="cmd-g">${r.g}</div>`:'';g=r.g;return h+`<div class="cmd-it${j===i?' on':''}" data-j="${j}"><span class="mi">${r.ic}</span><div class="main"><b>${esc(r.t)}</b>${r.s?`<small>${esc(r.s)}</small>`:''}</div></div>`}).join('')||'<div class="empty">Nada encontrado.</div>';
  hydrate($('#cmdL',ov));$('.cmd-it.on',ov)?.scrollIntoView({block:'nearest'})};
 const run=j=>{const r=R[j];if(!r)return;close();r.go()};
 const inp=$('#cmdQ',ov);inp.oninput=()=>{i=0;draw()};
 inp.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();i=Math.min(R.length-1,i+1);draw()}else if(e.key==='ArrowUp'){e.preventDefault();i=Math.max(0,i-1);draw()}else if(e.key==='Enter'){e.preventDefault();run(i)}else if(e.key==='Escape')close()};
 ov.addEventListener('mousedown',e=>{if(e.target===ov)close();const it=e.target.closest('[data-j]');if(it){e.preventDefault();run(+it.dataset.j)}});
 draw();inp.focus();
}

function guessArea(role){const r=norm(role);if(/gerent|coorden|supervis|diretor|gestor|lider|chefe/.test(r))return'gestao';if(/engenh/.test(r))return'eng';if(/medic|enferm|saude/.test(r))return'saude';if(/trainee|estagi|estudant|aprendiz/.test(r))return'estudante';if(/tecnic|tst/.test(r))return'campo';if(/analist|assist|administr|auxiliar/.test(r))return'analista';return''}
const areaOf=()=>ENV.k==='sst'?(AREAS[DB.profile.area]||AREAS[guessArea(DB.profile.role)]||AREAS.analista):ENV.area;
function ensureFolders(area){const A=typeof area==='string'?AREAS[area]:area;if(!A)return[];const made=[];A.folders.forEach(([name,ic])=>{if(!folderByName(name)){const f={id:uid(),name,icon:{t:'emoji',v:ic},pinned:false,created:Date.now()};DB.folders.push(f);made.push(name)}});return made}

const Sound={ctx:null,
 init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}},
 tone(f,t0,d,type='sine',vol=.18,f2){const c=this.ctx;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+t0+d);g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol,c.currentTime+t0+.012);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+.05)},
 play(kind){if(DB&&DB.settings.sound===false)return;this.init();const c=this.ctx;if(!c)return;if(c.state==='suspended')c.resume();
  if(kind==='notify'){this.tone(880,0,.35,'sine',.16);this.tone(1318.5,.14,.5,'sine',.14);this.tone(1760,.28,.6,'sine',.07)}
  else if(kind==='done'){this.tone(523.25,0,.16,'triangle',.14);this.tone(783.99,.09,.22,'triangle',.14);this.tone(1046.5,.18,.4,'sine',.12)}
  else if(kind==='tick'){this.tone(1200,0,.08,'sine',.07,1500)}
  else if(kind==='coin'){this.tone(987.77,0,.09,'square',.05);this.tone(1318.5,.08,.3,'square',.05)}}
};
document.addEventListener('pointerdown',()=>Sound.init(),{once:true});

const FIN_CATS={out:[['Moradia','🏠'],['Mercado','🛒'],['Alimentação','🍔'],['Transporte','🚗'],['Contas da casa','💡'],['Saúde','💊'],['Educação','📚'],['Lazer','🎉'],['Assinaturas','📺'],['Cartão de crédito','💳'],['Compras','🛍️'],['Outros','📦']],in:[['Salário','💼'],['Renda extra','💰'],['Investimentos','📈'],['Outros','➕']]};

const BRL=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const BRLs=v=>{const a=Math.abs(v);return a>=1e6?(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi':a>=1e4?(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil':Math.round(v).toLocaleString('pt-BR')};
function parseMoney(s){s=String(s||'').trim().replace(/[^\d,.-]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Math.round(parseFloat(s)*100)/100}
function finDB(){DB.fin=DB.fin||{};const F=DB.fin;F.tx=F.tx||[];F.rec=F.rec||[];return F}
const catIc=(type,name)=>(FIN_CATS[type].find(c=>c[0]===name)||[])[1]||'📦';
const FV={mode:'mes',ref:today(),q:'',type:'',cat:''};
function finRange(){const d=parseDate(FV.ref);if(FV.mode==='mes'){const a=new Date(d.getFullYear(),d.getMonth(),1),b=new Date(d.getFullYear(),d.getMonth()+1,0);return[fmtDate(a),fmtDate(b)]}const a=new Date(d);a.setDate(d.getDate()-d.getDay());const b=new Date(a);b.setDate(a.getDate()+6);return[fmtDate(a),fmtDate(b)]}
function finLabel(){const[a,b]=finRange();const d=parseDate(FV.ref);return FV.mode==='mes'?`${MESES[d.getMonth()]} ${d.getFullYear()}`:`${brDate(a).slice(0,5)} a ${brDate(b).slice(0,5)}`}
function genRecurring(month){const F=finDB();let made=false;F.rec.filter(r=>r.active!==false&&month>=(r.start||'0000-00')).forEach(r=>{if(F.tx.some(t=>t.recId===r.id&&t.date.startsWith(month)))return;const[y,m]=month.split('-').map(Number);const last=new Date(y,m,0).getDate();F.tx.push({id:uid(),type:r.type,amount:r.amount,cat:r.cat,desc:r.desc,method:r.method||'',date:`${month}-${pad(Math.min(r.day||1,last))}`,paid:false,recId:r.id,created:Date.now()});made=true});if(made)save()}
function ensureRecForRange(){const[a,b]=finRange();genRecurring(a.slice(0,7));if(b.slice(0,7)!==a.slice(0,7))genRecurring(b.slice(0,7));genRecurring(today().slice(0,7))}
function editTx(id,preset={}){

 const catOpts=type=>FIN_CATS[type].map(([n,i])=>`<option value="${n}" ${n===x.cat?'selected':''}>${i} ${n}</option>`).join('');
 openModal(id?'Lançamento':(x.type==='in'?'Nova receita':'Nova despesa'),`
  <div class="frow"><label>Tipo<select name="type" id="txType"><option value="out" ${x.type==='out'?'selected':''}>💸 Despesa</option><option value="in" ${x.type==='in'?'selected':''}>💰 Receita</option></select></label><label>Valor (R$)<input name="amount" inputmode="decimal" required value="${x.amount!==''?String(x.amount).replace('.',','):''}" placeholder="0,00"></label></div>

function niceMax(v){if(v<=0)return 100;const e=Math.pow(10,Math.floor(Math.log10(v)));const n=v/e;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*e}
function colChart(host,groups,series,opts={}){
 const W=Math.max(260,host.clientWidth||600),H=opts.h||220,ml=48,mr=8,mt=10,mb=26,iw=W-ml-mr,ih=H-mt-mb;
 const max=niceMax(Math.max(0,...groups.flatMap(g=>g.v)));const band=iw/groups.length;const n=series.length;
 const bw=Math.max(3,Math.min(24,(band*.7-(n-1)*2)/n));const y=v=>mt+ih-(v/max)*ih;
 let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Gráfico')}">`;
 for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);s+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" style="stroke:var(--line)" stroke-width="1"/><text x="${ml-8}" y="${yy}" text-anchor="end" dominant-baseline="central" style="fill:var(--muted)" font-size="11">${BRLs(v)}</text>`}
 const every=Math.ceil(groups.length/(W/46));
 groups.forEach((g,i)=>{const cx=ml+band*i+band/2,tot=n*bw+(n-1)*2;
  g.v.forEach((v,j)=>{if(!(v>0))return;const x=cx-tot/2+j*(bw+2),yy=y(v),h=mt+ih-yy,r=Math.min(4,bw/2,h);
   s+=`<path d="M${x} ${mt+ih}V${yy+r}Q${x} ${yy} ${x+r} ${yy}H${x+bw-r}Q${x+bw} ${yy} ${x+bw} ${yy+r}V${mt+ih}Z" style="fill:${series[j].c}"/>`});
  if(i%every===0||g.hl)s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" style="fill:${g.hl?'var(--text)':'var(--muted)'}" font-size="11" font-weight="${g.hl?700:400}">${esc(g.l)}</text>`;
  s+=`<rect class="hit" data-i="${i}" x="${ml+band*i}" y="${mt}" width="${band}" height="${ih}" fill="transparent"/>`});
 s+=`<line x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}" style="stroke:var(--line2)" stroke-width="1"/></svg><div class="ctip"></div>`;
 host.innerHTML=s;const tip=$('.ctip',host);
 $$('.hit',host).forEach(r=>{r.onmouseenter=()=>{const g=groups[+r.dataset.i];tip.innerHTML=`<b>${esc(g.t||g.l)}</b>`+series.map((se,j)=>`<div><i style="background:${se.c}"></i>${se.n}<span>${BRL(g.v[j])}</span></div>`).join('');tip.style.display='block';const bx=+r.getAttribute('x')+(+r.getAttribute('width'))/2;tip.style.left=Math.min(W-tip.offsetWidth-4,Math.max(4,bx-tip.offsetWidth/2))+'px';tip.style.top='4px';r.setAttribute('fill','rgba(127,140,160,.08)')};r.onmouseleave=()=>{tip.style.display='none';r.setAttribute('fill','transparent')}});
}

const AIW={};
function aiOpen(site,url,mode){
 url=url||site.url;
 if(mode==='tab'){window.open(url,'_blank');return}
 const sw=screen.availWidth,sh=screen.availHeight,sl=screen.availLeft||0,st=screen.availTop||0;const w=Math.round(Math.min(Math.max(460,sw*.4),760));
 const feat=`popup=yes,width=${w},height=${sh},left=${sl+sw-w},top=${st}`;
 const win=window.open(url,'onex-ia-'+site.k,feat);
 if(!win){toast('O navegador bloqueou a janela. Permita pop-ups para este arquivo e tente de novo.','err');return}
 AIW[site.k]=win;try{win.focus()}catch(e){}
 DB.aiLast=site.k;save();
}
function vIA(el){
 const hist=(DB.aiHist||[]).slice(0,8);
 el.innerHTML=`<div class="page" style="max-width:980px">
  <div class="ph"><div><div class="eyebrow" style="color:var(--gold)">✦ IA</div><h1>Suas IAs, a um clique</h1><div class="sub">Escreva uma vez e envie para o ChatGPT ou o Claude. Eles abrem numa <b>janela lateral encaixada à direita</b>, com o seu login, sem abas extras no navegador.</div></div></div>
  <div class="ai-box"><textarea id="aiP" rows="3" placeholder="Pergunte qualquer coisa… (Ctrl+Enter envia para a última IA usada)"></textarea>
   <div class="ai-send">${AI_SITES.filter(s=>s.q).slice(0,2).map(s=>`<button class="btn ${s.k===(DB.aiLast||'chatgpt')?'primary':''}" data-send="${s.k}"><span class="aic" style="color:${s.k===(DB.aiLast||'chatgpt')?'#fff':s.c}">${s.ic}</span>Enviar ao ${s.n}</button>`).join('')}<span class="grow"></span><button class="btn ghost sm" id="aiCopy">Copiar texto</button></div></div>
  <div class="ai-grid">${AI_SITES.map((s,i)=>`<div class="ai-card${i<2?' big':''}" style="--c:${s.c}"><div class="ai-top"><span class="aic" style="color:${s.c}">${s.ic}</span><div><b>${s.n}</b><small>${s.by}</small></div></div><div class="row gap wrap"><button class="btn sm ${i<2?'primary':''}" data-side="${s.k}">◧ Abrir ao lado</button><button class="btn sm ghost" data-tab="${s.k}">Nova aba ↗</button></div></div>`).join('')}</div>
  ${hist.length?`<section class="mt"><div class="sec-h"><h2 class="sec">Perguntas recentes</h2><button class="link" id="aiClr">Limpar</button></div><div class="rows">${hist.map((h,i)=>`<div class="row-i" data-h="${i}"><span class="aic" style="color:${AI_SITES.find(s=>s.k===h.s)?.c||'var(--muted)'}">${AI_SITES.find(s=>s.k===h.s)?.ic||'✦'}</span><div class="main"><span class="ttl">${esc(h.q)}</span><span class="meta">${AI_SITES.find(s=>s.k===h.s)?.n||''} · ${relTime(h.ts)}</span></div><button class="btn sm ghost" data-reuse="${i}">Reusar</button></div>`).join('')}</div></section>`:''}
  <div class="ai-tip"><b>💡 Dica para ficar lado a lado:</b> com o ONEX aberto, pressione <kbd>Win</kbd> + <kbd>←</kbd> para encaixá-lo à esquerda. A janela da IA abre sozinha à direita. <span class="muted">ChatGPT e Claude não permitem ser exibidos dentro de outros sites (proteção deles), por isso usamos a janela encaixada — o login fica salvo nela.</span></div>
  <section class="panel ai-soon"><img src="${LOGO_TILE}" alt=""><div><div class="eyebrow" style="color:var(--gold);margin:0">Em breve</div><b>Assistente ONEX</b><p>Uma IA integrada que conhece sua agenda, pendências, páginas e finanças — e se adapta a cada ambiente.</p></div></section>
 </div>`;
 const P=$('#aiP');
 const send=k=>{const s=AI_SITES.find(x=>x.k===k);const q=P.value.trim();if(!q){aiOpen(s);return}
  try{navigator.clipboard.writeText(q).catch(()=>{})}catch(e){}
  DB.aiHist=[{q,s:k,ts:Date.now()},...(DB.aiHist||[]).filter(h=>h.q!==q)].slice(0,20);save();
  aiOpen(s,s.q?s.q(q):s.url);toast(`Enviado ao ${s.n}. Se o texto não aparecer, cole com Ctrl+V.`);P.value='';renderCurrent()};
 $$('[data-send]',el).forEach(b=>b.onclick=()=>send(b.dataset.send));
 P.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send(DB.aiLast||'chatgpt')}};
 $('#aiCopy').onclick=()=>{navigator.clipboard.writeText(P.value).then(()=>toast('Copiado ✓','ok'))};
 $$('[data-side]',el).forEach(b=>b.onclick=()=>aiOpen(AI_SITES.find(s=>s.k===b.dataset.side)));
 $$('[data-tab]',el).forEach(b=>b.onclick=()=>aiOpen(AI_SITES.find(s=>s.k===b.dataset.tab),null,'tab'));
 $$('[data-reuse]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();P.value=hist[+b.dataset.reuse].q;P.focus()});
 $$('[data-h]',el).forEach(r=>r.onclick=()=>{P.value=hist[+r.dataset.h].q;P.focus()});
 if($('#aiClr'))$('#aiClr').onclick=()=>{DB.aiHist=[];save();renderCurrent()};
 setTimeout(()=>P.focus(),50);
}

function seed(flowOnly){
 if(!flowOnly)return;const F=ENV.flow();
 DB.flows.push({id:uid(),title:F.title,created:Date.now(),updated:Date.now(),nodes:F.nodes,edges:F.edges});
}

function bindShell(){
 $$('.nav-i').forEach(b=>b.onclick=()=>go(b.dataset.v));
 $('#favs').onclick=e=>{const b=e.target.closest('[data-fav]');if(b)go('notas',b.dataset.fav);const f=e.target.closest('[data-gofolder]');if(f)go('pasta',f.dataset.gofolder)};
 $('#tree').onclick=e=>{
  const t=e.target.closest('[data-tog]');if(t){e.stopPropagation();const id=t.dataset.tog;OPEN.has(id)?OPEN.delete(id):OPEN.add(id);saveOpen();renderSide();return}
  const m=e.target.closest('[data-fmenu]');if(m){e.stopPropagation();const fo=folderById(m.dataset.fmenu);if(fo)folderMenu(m,fo);return}
  const n=e.target.closest('[data-fnew]');if(n){e.stopPropagation();newNote('blank',n.dataset.fnew);return}
  if(e.target.closest('[data-addfolder]')){newFolder();return}
  const pg=e.target.closest('[data-fav]');if(pg){go('notas',pg.dataset.fav);return}
  const r=e.target.closest('[data-folder]');if(r){OPEN.add(r.dataset.folder);saveOpen();go('pasta',r.dataset.folder)}};
 $('#tree').oncontextmenu=e=>{const r=e.target.closest('[data-folder]');if(!r)return;e.preventDefault();const fo=folderById(r.dataset.folder);if(fo)folderMenu({getBoundingClientRect:()=>({left:e.clientX,right:e.clientX,top:e.clientY,bottom:e.clientY})},fo)};
 $('#addFolder').onclick=newFolder;$('#envBtn').onclick=e=>envMenu(e.currentTarget);$('#meBtn').onclick=()=>go('perfil');$('#brandBtn').onclick=()=>go('home');
 $('#sync').onclick=()=>{if(Store.state==='reconnect')Store.reconnect();else go('config')};
 $('#openCmd').onclick=openCmd;$('#bellBtn').onclick=e=>openBell(e.currentTarget);
 $('#newBtn').onclick=e=>openMenu(e.currentTarget,[{l:'Pendência',ic:'✓',fn:()=>editTask(null)},{l:'Compromisso',ic:'📅',fn:()=>editEvent(null)},{l:'Página',ic:'📄',fn:()=>newNote('blank')},{l:'Página a partir de modelo',ic:'🧩',fn:()=>go('notas')},{l:'Fluxograma',ic:'🔀',fn:newFlow},{l:'Pasta',ic:'📁',fn:newFolder},...(ENV.fin?[{l:'Despesa',ic:'💸',fn:()=>editTx(null,{type:'out'})},{l:'Receita',ic:'💰',fn:()=>editTx(null,{type:'in',cat:'Salário'})}]:[]),'-',{l:'Diário de hoje',ic:'📓',fn:()=>go('diario',today())}]);
 const view=$('#view');
 view.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');if(a){ACTIONS[a.dataset.a]?.(a);return}
  const dl=e.target.closest('[data-delnote]');if(dl){e.stopPropagation();const n=noteById(dl.dataset.delnote);if(n)deletePage(n);return}
  const lk=e.target.closest('.lnk[data-note]');if(lk){e.stopPropagation();go('notas',lk.dataset.note);return}
  const dn=e.target.closest('[data-done]');if(dn){e.stopPropagation();const x=DB.tasks.find(t=>t.id===dn.dataset.done);if(!x)return;const on=x.status!=='done';x.status=on?'done':'todo';x.doneAt=on?Date.now():null;dn.classList.toggle('on',on);save();if(on)celebrate('Pendência concluída ✓');setTimeout(()=>{if(VIEW==='pend')drawKanban();else if(VIEW!=='notas')renderCurrent()},280);return}
  const ft=e.target.closest('[data-fintx]');if(ft){e.stopPropagation();editTx(ft.dataset.fintx);return}
  const ev=e.target.closest('[data-event]');if(ev){editEvent(ev.dataset.event);return}
  const t=e.target.closest('[data-task]');if(t){editTask(t.dataset.task);return}
  const n=e.target.closest('[data-note]');if(n){go('notas',n.dataset.note);return}
 });
 document.addEventListener('contextmenu',e=>{const el=e.target.closest('[data-note],[data-fav]');if(!el||e.target.closest('.editor')||e.target.closest('.fcanvas'))return;const n=noteById(el.dataset.note||el.dataset.fav);if(!n)return;e.preventDefault();noteMenu({getBoundingClientRect:()=>({left:e.clientX,right:e.clientX,top:e.clientY,bottom:e.clientY})},n)});
 document.addEventListener('selectionchange',debounce(bubbleCheck,90));
 $('#view').addEventListener('scroll',()=>{hideBubble();closeSlash()},true);
 document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd();return}
  if(e.key==='Escape'&&POP){closePop();return}
  flowKey(e);
 });
 document.addEventListener('keyup',e=>{if(e.key===' '&&FS.space){FS.space=false;canvasCls('space',false)}});
 window.addEventListener('focus',()=>{Store.checkExternal();Notif.check()});
 window.addEventListener('resize',()=>{closePop();hideBubble()});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&Store.dirty)Store.writeNow();else if(!document.hidden){Store.checkExternal();Notif.check()}});
 window.addEventListener('beforeunload',e=>{if(window.__resetting)return;if(Store.dirty||Store.writing){Store.writeNow();e.preventDefault();e.returnValue=''}});
 setInterval(()=>Notif.check(),30000);
 setInterval(()=>{renderSync();renderSideCounts()},60000);
}
const QUOTES=['Pequenos passos todos os dias constroem grandes resultados.','Organização é liberdade: menos esforço para lembrar, mais energia para fazer.','Comece por onde você está. Use o que você tem. Faça o que puder.','Feito é melhor que perfeito.','Disciplina é escolher entre o que você quer agora e o que você quer mais.','Um dia de cada vez, uma tarefa de cada vez.','O segredo de avançar é começar.','Clareza gera foco. Foco gera resultado.','Grandes projetos são só pequenas tarefas bem organizadas.','Seu futuro é criado pelo que você faz hoje, não amanhã.','Consistência vence intensidade.','Planeje com calma, execute com coragem.','Quem anota, não esquece. Quem planeja, não se perde.','Cada tarefa concluída é uma vitória. Comemore as pequenas.','Transforme ideias em planos e planos em conquistas.','Você não precisa ver a escada inteira, só dar o primeiro passo.','Menos caos, mais criação.','Hoje é um ótimo dia para tirar algo do papel.'];
function showSplash(){
 const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];
 const sp=document.createElement('div');sp.className='splash';
 sp.innerHTML=`<span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><div class="in"><img class="sym" src="${LOGO_SYM}" alt=""><img class="word" src="${LOGO_WORD_D}" alt="ONEX"><div class="status" id="spSt">Otimizando o app</div><div class="pbar"><i id="spBar"></i></div><div class="quote">${esc(q)}</div></div>`;
 document.body.appendChild(sp);const t0=Date.now(),DUR=2600;
 const steps=['Otimizando o app','Carregando seus dados','Sincronizando sua pasta','Preparando seu ambiente','Tudo pronto'];let k=0;
 const bar=$('#spBar',sp),st=$('#spSt',sp);
 const tick=setInterval(()=>{const p=Math.min(1,(Date.now()-t0)/DUR);bar.style.width=(p*100)+'%';const nk=Math.min(steps.length-1,Math.floor(p*steps.length));if(nk!==k){k=nk;st.textContent=steps[k]}},50);
 return()=>new Promise(r=>setTimeout(()=>{clearInterval(tick);bar.style.width='100%';st.textContent='Tudo pronto';setTimeout(()=>{sp.classList.add('out');setTimeout(()=>{sp.remove();r()},450)},250)},Math.max(0,DUR-(Date.now()-t0))))
}
async function init(){
 const hideSplash=showSplash();
 let k=null;try{k=localStorage.getItem('onex-env')}catch(e){}
 if(!k||!ENVS[k]){k='pessoal';try{if(localStorage.getItem('sst-assistente-v1'))k='sst'}catch(e){}}
 applyEnv(k);
 DB=defaultDB();
 try{const raw=localStorage.getItem(LS_KEY);if(raw)DB=normalize(JSON.parse(raw))}catch(e){}
 const fav=document.querySelector('link[rel=icon]');if(fav)fav.href=LOGO_FAV;
 applyTheme();bindShell();go('home');
 await Store.init();Notif.check();
 if(!DB.profile.onboarded)showOnboarding();
 await hideSplash();
}
init();
</script>
